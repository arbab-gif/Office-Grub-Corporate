      <div class="nav-label">Overview</div>

      <a class="nav-item" href="reservations.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v6H4z"/><path d="M4 11c0 5 4 8 8 8s8-3 8-8"/></svg>Reservations</a>

        <div class="lbl-list" id="list"></div>
